## Minimal BepInEx config for Mini Motorways.
## BepInEx adds every other setting, with its default value, the first time the game starts.

[Chainloader]

## REQUIRED for Mini Motorways. The game destroys any visible root GameObject it doesn't own,
## including BepInEx's manager object, and then no plugin ever gets Update calls.
# Setting type: Boolean
# Default value: false
HideManagerGameObject = true
